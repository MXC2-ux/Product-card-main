<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">


  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="card">
<div class="photo">

<img src="images/image-product-desktop.jpg" alt="perfume">
 </div>

<div class="content">

 <p class="category">PERFUME</p>

  <h1>Gabrielle Essence Eau De Parfum </h1>

 <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL. </p>

<div class="price">
  <p class="new">$149.99 </p>
  <p class="old">$169.99 </p>
  </div>

  <button>
    <img src="images/icon-cart.svg" alt="">
    Add to Cart
</button>

</div>

</body>
</html>
